name: Publish to PyPI

# Trusted publishing (no PyPI token in GitHub secrets).
# Triggers on version tags such as v0.2.14. The tag must match
# [project].version in pyproject.toml.
#
# One-time setup after this workflow is on the default branch:
#   1. PyPI → Publishing → add a pending publisher for project "figmaclaw"
#      (owner aviadr1, repository figmaclaw, workflow release.yml,
#      environment pypi).
#   2. GitHub → Settings → Environments → create "pypi" (no secrets).
#   3. Tag the release commit: git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/figmaclaw
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Require tag to match project version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}. Push a tag named v${version}."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the built wheel in a clean venv
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/figmaclaw --version
          /tmp/wheel-check/bin/figmaclaw --help > /dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
